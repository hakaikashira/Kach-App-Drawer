[MeterLabel]
Meter=String
X=(#DrawerWidth#+8)
Y=0
W=180
H=30
FontFace=Segoe UI
FontSize=10
FontColor=255,255,255,235
StringStyle=Normal
AntiAlias=1
SolidColor=18,18,22,150
Padding=10,6,10,6
Hidden=1

[MeterHint]
Meter=String
X=0
Y=(#DrawerHeight#-20)
W=#DrawerWidth#
H=16
FontFace=Segoe UI
FontSize=7
FontColor=255,255,255,70
StringAlign=Center
Text=SCROLL
AntiAlias=1
Hidden=1