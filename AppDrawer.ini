[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=0
WindowX=50%
AnchorX=50%
WindowY=50%
AnchorY=50%
OnRefreshAction=[!CommandMeasure MeasureDiscovery Run]

[Variables]
@Include=#@#Variables.inc

[MeasureDiscovery]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#DiscoverApps.ps1"
State=Hide
OutputType=ANSI
Timeout=120000
FinishAction=[!CommandMeasure MeasureScript "ReloadApps()"]

[MeasureScript]
Measure=Script
ScriptFile=#@#Drawer.lua

[MeterGlass]
Meter=Shape
Shape=Rectangle 0,0,#DrawerWidth#,100,#CornerRadius# | Fill Color 18,18,22,46 | StrokeWidth 1 | Stroke Color 255,255,255,32
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
MouseLeaveAction=[!CommandMeasure MeasureScript "LeaveAll()"]

[MeterIcon1]
Meter=Image
DynamicVariables=1
X=0
Y=0
W=#IconSize#
H=#IconSize#
ImageName=#@#Icons\placeholder.png
ImageAlpha=90
PreserveAspectRatio=1
AntiAlias=1
MouseOverAction=[!CommandMeasure MeasureScript "Hover(1)"]
MouseLeaveAction=[!CommandMeasure MeasureScript "Leave(1)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "Launch(1)"]
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]


